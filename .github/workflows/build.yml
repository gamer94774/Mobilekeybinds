
name: Build Android Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
          target: Android64

      - name: Fix Geode version metadata
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          for package in Path(os.environ["BUILD_OUTPUT"]).glob("*.geode"):
              with zipfile.ZipFile(package, "r") as src:
                  files = [(info, src.read(info.filename)) for info in src.infolist()]

              temp = package.with_suffix(".tmp")

              with zipfile.ZipFile(temp, "w") as dst:
                  for info, data in files:
                      if info.filename == "mod.json":
                          metadata = json.loads(data)
                          metadata["geode"] = "v6.0.0"
                          data = json.dumps(metadata, indent=2).encode()
                      dst.writestr(info, data)

              temp.replace(package)
          PY

      - name: Validate mod package
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          packages = list(Path(os.environ["BUILD_OUTPUT"]).glob("*.geode"))
          assert packages, "No .geode package found!"

          for package in packages:
              print(f"Checking {package.name}")

              with zipfile.ZipFile(package, "r") as archive:
                  assert archive.testzip() is None, "Corrupt ZIP archive!"

                  metadata = json.loads(archive.read("mod.json"))
                  assert metadata["geode"] == "v6.0.0", "Wrong Geode version!"
                  assert metadata["gd"]["android"] == "2.2091", "Wrong GD version!"
                  assert metadata["id"] == "gamer94774.mobilekeybinds", "Wrong mod ID!"

                  binary_name = metadata["id"] + ".android64.so"
                  assert binary_name in archive.namelist(), "Android binary missing!"

                  binary = archive.read(binary_name)
                  assert binary[:4] == b"\x7fELF", "Invalid Android binary!"

              print("Package validation successful!")

          PY

      - name: Upload the mod
        uses: actions/upload-artifact@v7
        with:
          name: Mobile-Keybinds
          path: ${{ steps.build.outputs.build-output }}
